[package]
name = "slime-soccer"
version = "0.1.0"
edition = "2021"
description = "Super Slime Soccer remake in Rust with soccer, volleyball and basketball modes"
license = "MIT"

[lib]
name = "slime_soccer"
path = "src/lib.rs"

[[bin]]
name = "slime-soccer"
path = "src/main.rs"

[dependencies]
macroquad = { version = "0.4", features = ["audio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
postcard = { version = "1", features = ["use-std"] }

[profile.dev]
opt-level = 1
